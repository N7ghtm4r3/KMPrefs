name: Deploy Prerelease

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: develop-prerelease
  cancel-in-progress: false

jobs:
  multiplatform-tests:
    name: Multiplatform tests
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "18"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run multiplatform tests
        run: ./gradlew :library:allTests --stacktrace

  android-tests:
    name: Android device tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "18"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-36"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 24
          arch: x86_64
          script: ./gradlew :library:connectedAndroidDeviceTest --stacktrace

  publish:
    name: Publish prerelease
    needs:
      - multiplatform-tests
      - android-tests

    runs-on: macos-15
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "18"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
            cache-disabled: true

      - name: Generate prerelease version
        id: version
        shell: bash
        run: |
          CONFIGURED_VERSION="$(
            ./gradlew :library:properties -q |
            awk -F': ' '$1 == "version" { print $2; exit }'
          )"

          if [[ "$CONFIGURED_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(alpha|beta|rc)([0-9]+)$ ]]; then
            SERIES="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
            START_NUMBER="${BASH_REMATCH[3]}"
          elif [[ "$CONFIGURED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            SERIES="${CONFIGURED_VERSION}-rc"
            START_NUMBER="01"
          else
            echo "Unsupported version: $CONFIGURED_VERSION"
            echo "Accepted formats:"
            echo "  1.2.0"
            echo "  1.2.0-alpha01"
            echo "  1.2.0-beta01"
            echo "  1.2.0-rc01"
            exit 1
          fi

          PREFIX="v${SERIES}"
          LATEST_NUMBER=""

          while IFS= read -r EXISTING_TAG; do
            NUMBER="${EXISTING_TAG#"$PREFIX"}"

            if [[ "$NUMBER" =~ ^[0-9]+$ ]]; then
              LATEST_NUMBER="$NUMBER"
              break
            fi
          done < <(
            git tag \
              --list "${PREFIX}*" \
              --sort=-version:refname
          )

          NEXT_NUMBER=$((10#$START_NUMBER))

          if [[ -n "$LATEST_NUMBER" ]]; then
            AFTER_LATEST=$((10#$LATEST_NUMBER + 1))

            if (( AFTER_LATEST > NEXT_NUMBER )); then
              NEXT_NUMBER=$AFTER_LATEST
            fi
          fi

          printf -v PADDED_NUMBER "%02d" "$NEXT_NUMBER"

          VERSION="${SERIES}${PADDED_NUMBER}"

          echo "Configured version: $CONFIGURED_VERSION"
          echo "Generated version: $VERSION"

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish with Vanniktech
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew :library:publishAndReleaseToMavenCentral \
            -Pversion=${{ steps.version.outputs.value }} \
            --no-configuration-cache \
            --stacktrace

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --generate-notes \
            --prerelease \
            --latest=false
